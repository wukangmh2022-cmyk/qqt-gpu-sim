<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>QQT 格斗 · 浏览器版</title>
<link rel="stylesheet" href="style.css?v=20260903-hud-clean">
</head>
<body>
<div id="wrap">
  <header>
    <h1>💣 QQT 格斗</h1>
    <div id="win-rate-wrap">
      <div class="win-rate-header">
        <span class="win-label-p0" id="p0-win-name">我方 (P0)</span>
        <span class="win-vs">⚡ 实时 AI 胜率对峙 ⚡</span>
        <span class="win-label-p1" id="p1-win-name">敌人 (P1)</span>
      </div>
      <div id="win-rate-bar" class="win-rate-bar">
        <div id="p0-win-fill" class="win-fill p0-fill" style="width: 50%;">
          <span id="p0-win-pct">50%</span>
        </div>
        <div id="p1-win-fill" class="win-fill p1-fill" style="width: 50%;">
          <span id="p1-win-pct">50%</span>
        </div>
      </div>
    </div>
  </header>

  <div id="layout">
    <div id="stage">
      <canvas id="game" width="900" height="906"></canvas>
      <div id="loading">
        <div class="box">
          <div class="spinner"></div>
          <div id="loading-text">正在加载… 0%</div>
        </div>
      </div>
      <div id="banner" class="hidden"></div>
    </div>

    <aside id="panel">
      <section>
        <h3>⚙️ 开局设置</h3>
        <label class="row">
          <button id="map-btn" type="button">🗺️ 换地图（黑屏菜单选择）</button>
        </label>
        <label>人物皮肤
          <select id="skin"></select>
        </label>
        <label>敌人 AI
          <div id="cur-model" class="cur">准备加载…</div>
          <select id="enemy-ai"></select>
          <button id="apply-model" type="button">应用</button>
        </label>
        <label class="row">
          <input type="checkbox" id="spectate"> 观战（AI vs AI，不操作）
        </label>
        <label id="p0-ai-wrap" class="row" style="display:none">
          我方：
          <select id="p0-ai"></select>
        </label>
        <label class="row">
          <input type="checkbox" id="danger" checked> 显示危险图（D 键切换，默认开）
        </label>
        <label class="row" title="调试训练用 _steer：开启后鼠标高亮玩家周围九宫格，点击执行一个目标动作">
          <input type="checkbox" id="mouse-path"> 鼠标寻路调试
        </label>
        <label class="radius-setting">
          <span>碰撞体半径 <output id="radius-value">0.42 格（50px）</output></span>
          <input id="radius" type="range" min="0.20" max="0.49" step="0.01" value="0.42">
        </label>
        <label class="row" title="AI 模型每隔 N tick 才推理一次，中间 tick 复用上次动作（省 CPU 提帧率；默认每 tick 推理）">
          <input type="checkbox" id="model-lowfreq"> AI 模型推理降频（省 CPU）
        </label>
        <label class="row">
          <input type="checkbox" id="sound" checked> 音效（M 键切换）
        </label>
        <label class="row">
          <input type="checkbox" id="bgm" checked> 背景音乐（随场景切换）
        </label>
        <button id="restart">开始 / 重新开局（R）</button>
      </section>

      <section>
        <h3>📊 状态</h3>
        <div id="status">加载模型中…</div>
      </section>

      <section>
        <h3>📼 录像</h3>
        <label class="row">
          <input type="checkbox" id="rec-clip"> 录制剪片/GIF 采样（保存视频无需勾选：状态帧与 60Hz 轨迹恒录）
        </label>
        <div class="rec-row">
          <button id="save-replay" type="button">💾 保存本局录像</button>
          <button id="save-gif" type="button">🎞️ 保存 GIF 动图</button>
          <button id="save-video" type="button">🎬 保存视频</button>
        </div>
        <div class="meta">动图/视频 = 最近 12 秒精彩片段（视频更小；GIF 可内嵌 GitHub README，WebP 不行）</div>
        <div id="rec-msg" class="meta"></div>
      </section>
    </aside>
  </div>

  <!-- 移动端触屏控制：竖屏时上方正方形画面，下方左摇杆 + 右放泡键 -->
  <div id="touch-controls" class="hidden">
    <div id="joystick"><div id="joystick-knob"></div></div>
    <div id="bomb-btn">💣</div>
  </div>
</div>

<script src="vendor/ort/ort.all.min.js"></script>
<script src="vendor/gifenc.global.js"></script>
<script src="sim.js?v=20260903-radius-042"></script>
<script src="main.js?v=20260903-radius-042"></script>
</body>
</html>
