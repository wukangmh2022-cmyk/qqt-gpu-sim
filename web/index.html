<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>QQT 格斗 · 浏览器版</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💣</text></svg>">
<link rel="stylesheet" href="style.css?v=20260903-hud-clean">
</head>
<body>
<div id="wrap">
  <header>
    <h1>💣 QQT 格斗</h1>
    <div id="win-rate-wrap">
      <div class="win-rate-header">
        <span class="win-label-p0" id="p0-win-name">我方 (P0)</span>
        <span class="win-vs">⚡ 实时 AI 胜率对峙 ⚡</span>
        <span class="win-label-p1" id="p1-win-name">敌人 (P1)</span>
      </div>
      <div id="win-rate-bar" class="win-rate-bar">
        <div id="p0-win-fill" class="win-fill p0-fill" style="width: 50%;">
          <span id="p0-win-pct">50%</span>
        </div>
        <div id="p1-win-fill" class="win-fill p1-fill" style="width: 50%;">
          <span id="p1-win-pct">50%</span>
        </div>
      </div>
    </div>
  </header>

  <div id="layout">
    <div id="stage">
      <canvas id="game" width="900" height="906"></canvas>
      <div id="loading">
        <div class="box">
          <div class="spinner"></div>
          <div id="loading-text">正在加载… 0%</div>
        </div>
      </div>
      <div id="banner" class="hidden"></div>
    </div>

    <aside id="panel">
      <section>
        <h3>⚙️ 开局设置</h3>
        <label class="row">
          <button id="map-btn" type="button">🗺️ 换地图（黑屏菜单选择）</button>
        </label>
        <label>初始血量
          <select id="initial-hp">
            <option value="1" selected>1 血（生死局一击必杀）</option>
            <option value="2">2 血</option>
            <option value="3">3 血</option>
            <option value="4">4 血</option>
            <option value="5">5 血（原版满血运营）</option>
          </select>
        </label>
        <label>人物皮肤
          <select id="skin"></select>
        </label>
        <label>泡泡皮肤
          <select id="bomb-skin"></select>
        </label>
        <label>敌人 AI
          <div id="cur-model" class="cur">准备加载…</div>
          <select id="enemy-ai"></select>
          <button id="apply-model" type="button">应用</button>
        </label>
        <label class="row">
          <input type="checkbox" id="spectate"> 观战（AI vs AI，不操作）
        </label>
        <label id="p0-ai-wrap" class="row" style="display:none">
          我方：
          <select id="p0-ai"></select>
        </label>
        <label class="row">
          <input type="checkbox" id="danger" checked> 显示危险图（D 键切换，默认开）
        </label>
        <label class="row" title="调试训练用 _steer：开启后鼠标高亮玩家周围九宫格，点击执行一个目标动作">
          <input type="checkbox" id="mouse-path"> 鼠标寻路调试
        </label>
        <label class="radius-setting">
          <span>碰撞体半径 <output id="radius-value">0.42 格（50px）</output></span>
          <input id="radius" type="range" min="0.20" max="0.49" step="0.01" value="0.42">
        </label>
        <label title="降低 AI 模型反应与决策频率（每 100~250ms 决策一次）：推理后即刻行动，间隔期维持惯性，彻底杜绝震荡">AI 反应降频
          <select id="ai-latency">
            <option value="100" selected>100ms（默认 · 电竞级 / 原生 10Hz）</option>
            <option value="150">150ms（人类高手 · 降频 50%）</option>
            <option value="200">200ms（普通玩家 · 降频 100%）</option>
            <option value="250">250ms（新手友好 · 降频 150%）</option>
          </select>
        </label>
        <label class="row">
          <input type="checkbox" id="sound" checked> 音效（M 键切换）
        </label>
        <label class="row">
          <input type="checkbox" id="bgm" checked> 背景音乐（随场景切换）
        </label>
        <button id="restart">开始 / 重新开局（R）</button>
      </section>

      <section>
        <h3>📊 状态</h3>
        <div id="status">加载模型中…</div>
      </section>

      <section id="jev-log-section">
        <h3>🧠 TypeSafe Jev 战术决策日志</h3>
        <div id="jev-status" style="font-size:12px; margin-bottom:6px; color:#4fc3f7;">等待 Jev 决策…</div>
        <div id="jev-logs" style="font-family:monospace; font-size:11px; max-height:150px; overflow-y:auto; background:#1e1e1e; padding:6px; border-radius:4px; line-height:1.4; color:#aaa;">
          等待对局启动…
        </div>
      </section>

      <section>
        <h3>📼 录像</h3>
        <label class="row">
          <input type="checkbox" id="rec-clip"> 录制剪片/GIF 采样（保存视频无需勾选：状态帧与 60Hz 轨迹恒录）
        </label>
        <div class="rec-row">
          <button id="save-replay" type="button">💾 保存本局录像</button>
          <button id="save-gif" type="button">🎞️ 保存 GIF 动图</button>
          <button id="save-video" type="button">🎬 保存视频</button>
        </div>
        <div class="meta">动图/视频 = 最近 12 秒精彩片段（视频更小；GIF 可内嵌 GitHub README，WebP 不行）</div>
        <div id="rec-msg" class="meta"></div>
      </section>
    </aside>
  </div>

  <!-- 移动端触屏控制：竖屏时上方正方形画面，下方左摇杆 + 右放泡键 -->
  <div id="touch-controls" class="hidden">
    <div id="joystick"><div id="joystick-knob"></div></div>
    <div id="bomb-btn">💣</div>
  </div>
</div>

<script src="vendor/ort/ort.all.min.js"></script>
<script src="vendor/gifenc.global.js"></script>
<script src="sim.js?v=20260917-latency-tiers"></script>
<script src="time_astar_ai.js?v=20260916-flee-v2"></script>
<script src="jev_ai.js"></script>
<script src="main.js?v=20260917-weaker-flagship"></script>
</body>
</html>
