<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QQT 格斗 · 浏览器版</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <header>
    <h1>💣 QQT 格斗</h1>
    <p class="sub">训练侧 PPO 模型（MLP 345K）在浏览器里实时推理 · 原版素材渲染 · 与你对战</p>
  </header>

  <div id="layout">
    <div id="stage">
      <canvas id="game" width="780" height="876"></canvas>
      <div id="loading">
        <div class="box">
          <div class="spinner"></div>
          <div id="loading-text">正在加载… 0%</div>
        </div>
      </div>
      <div id="banner" class="hidden"></div>
    </div>

    <aside id="panel">
      <section>
        <h3>⚙️ 开局设置</h3>
        <label>地图
          <select id="mode">
            <option value="open" selected>空场（中心宝箱 · 8泡/6威/1.68速起步）</option>
            <option value="corridor">走廊（顶墙侧砖 · 2泡/2威/1.6速起步 踩箱成长）</option>
          </select>
        </label>
        <label>场景（皮肤 + 背景音乐）
          <select id="scene"></select>
        </label>
        <label>人物皮肤
          <select id="skin"></select>
        </label>
        <label>敌人 AI
          <div id="cur-model" class="cur">加载中…</div>
          <select id="enemy-ai"></select>
          <button id="apply-model" type="button">应用</button>
        </label>
        <label class="row">
          <input type="checkbox" id="spectate"> 观战（AI vs AI，不操作）
        </label>
        <label id="p0-ai-wrap" class="row" style="display:none">
          我方：
          <select id="p0-ai"></select>
        </label>
        <label class="row">
          <input type="checkbox" id="danger" checked> 显示危险图（D 键切换，默认开）
        </label>
        <label class="row">
          <input type="checkbox" id="sound" checked> 音效（M 键切换）
        </label>
        <label class="row">
          <input type="checkbox" id="bgm" checked> 背景音乐（随场景切换）
        </label>
        <button id="restart">开始 / 重新开局（R）</button>
      </section>

      <section>
        <h3>📊 状态</h3>
        <div id="status">加载模型中…</div>
      </section>

      <section>
        <h3>📼 录像</h3>
        <div class="rec-row">
          <button id="save-replay" type="button">💾 保存本局录像</button>
          <button id="save-webp" type="button">🎞️ 保存 WebP 动图</button>
          <button id="save-video" type="button">🎬 保存视频</button>
        </div>
        <div class="meta">动图/视频 = 最近 12 秒精彩片段（视频更小，动图可放 README）</div>
        <div id="rec-msg" class="meta"></div>
      </section>
    </aside>
  </div>

  <!-- 移动端触屏控制：竖屏时上方正方形画面，下方左摇杆 + 右放泡键 -->
  <div id="touch-controls" class="hidden">
    <div id="joystick"><div id="joystick-knob"></div></div>
    <div id="bomb-btn">💣</div>
  </div>
</div>

<script src="vendor/webp-anim/webp-wasm.js"></script>
<script src="vendor/webp-anim/anim.global.js"></script>
<script src="sim.js"></script>
<script src="main.js"></script>
</body>
</html>
