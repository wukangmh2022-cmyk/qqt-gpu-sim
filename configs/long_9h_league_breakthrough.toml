# ============================================================================
# 实验：12节点24卡 DCU 破局长训 - 联赛攻防全开宗师版 (Warm-Start 继承 aggr419)
# 核心技术创新与根因攻克：
# 1. 彻底根除发呆对峙：
#    - 继承 0% 超时、开阔地极速肉搏战意之王：params_aggr_it00000419_ema.pkl
#    - 彻底拆除消极避战惩罚：mutual_hit_penalty = 0.0, double_death_penalty = 0.0
#    - 恢复强力进攻激励：win_bonus = 10.0, lose_bonus = 10.0
# 2. 多元联赛对手池 (League Sparring Pool)：
#    - 15% 纯静止木桩 (Pure Idle [4, 0])：永久保持“见不动靶即刻近身诛杀”的神经反射
#    - 15% 高级时空 A* 竞技猎人 (TimeAStarAI)：保持巅峰级微操躲弹与引信博弈
#    - 10% 修复版高智商拉扯 (FleeBotAI)：练习中距离追击围堵与反风筝能力
#    - 60% 自对弈 (Self-Play) + 动态快照回滚
# 3. 开阔地权重提升：
#    - level_weights = "empty=0.20,功夫=0.30,比武=0.30,爱的考验=0.20"
#    - 杜绝开阔地仅 5% 导致的分布饥饿
# 4. 血量域随机化 (HP_DOMAIN_RAND=1: 1~5 血全覆盖，生死局与长线运营兼顾)
# ============================================================================

[run]
name = "long_9h_league_breakthrough"
iters = 1200
seed = 2026
fresh = true

[model]
arch = "transformer"
embed = 392
depth = 4
patch = 3
heads = 4
ff_factor = 4
obs_channels = 14
init_params = "ckpt/params_aggr_it00000419_ema.pkl"
ema_decay = 0.995

[rollout]
num_envs = 24576
num_steps = 256
minibatch = 24576
epochs = 2

[optimizer]
lr = 0.00020
gamma = 0.995
lam = 0.95
clip_eps = 0.2
vf_coef = 0.5
ent_coef = 0.008

[reward]
profile = "dense_win10_league_clean"
step_penalty = 0.002
hit_reward = 1.5
win_bonus = 10.0
trade_win_bonus = 5.0
lose_bonus_start = 10.0
lose_bonus_floor = 10.0
mutual_hit_penalty = 0.0
double_death_penalty = 0.0
win_hp_bonus = 0.2
flee_bot_ratio = 0.25
timeout_mode = "hp_diff_scaled"
timeout_max_bonus = 2.0
timeout_per_hp = 0.5
timeout_alpha_mode = "shared_linear_anneal"
timeout_lead_bonus = 2.0
timeout_trail_penalty = 5.0
timeout_draw_bonus = -3.0
adv_top_frac = 0.25
crate_reward_coef = 0.25
crate_reward_floor = 0.10
crate_reward_anneal_steps = 0
explore_reward_coef = 0.0
explore_reward_anneal_steps = 0
brick_reward_coef = 0.20
reward_anneal_k = 0.0
reward_anneal_step_offset = 0

[value]
