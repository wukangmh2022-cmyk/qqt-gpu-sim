# ============================================================================
# 实验：12节点24卡 DCU 进阶进攻超长训 - 动静结合全地形追猎版 (Warm-Start 继承 it1100)
# 核心规格：
# 1. 规模：12 机 × 2 卡 = 24 张 DCU，num_envs=24576 (单卡 1024 envs)
# 2. 轮次：800 iters (~6.1 小时)
# 3. 底模继承 (Warm-Start)：基于最新 138 亿步的 params_it00001100_ema.pkl
# 4. 规则敌人混合池 (flee_bot_ratio = 0.20)：
#    - 30% 静态死靶 (Idle Bot，占全环境 6%)：彻底不动不放炮，专治面对静止目标发呆
#    - 30% 纯漫游走位 (Roam Bot，占全环境 6%)：随机走位不放炮，专练开阔地拦截围堵
#    - 40% 逃跑反击 (Flee Bot，占全环境 8%)：远离对手并在贴身时落雷，维持警惕防突袭
# 5. 攻防兼备激励：
#    - mutual_hit_penalty = 1.0 (互损扣 1 分)
#    - double_death_penalty = 5.0 (双亡重罚)
#    - win_hp_bonus = 0.5 (残余血量激励)
#    - brick_reward_coef = 0.30 (破墙即时奖励)
#    - step_penalty = 0.002 (时间流逝惩罚，坚决打击消极)
#    - timeout_trail_penalty = 5.0 (落后逃跑重罚)
#    - timeout_draw_bonus = -2.0 (超时平局双输重罚)
# ============================================================================

[run]
name = "long_6h_active_hunt"
iters = 800
seed = 43
fresh = true

[model]
arch = "transformer"
embed = 392
depth = 4
patch = 3
heads = 4
ff_factor = 4
obs_channels = 14
init_params = "ckpt/params_it00001100_ema.pkl"
ema_decay = 0.995

[rollout]
num_envs = 24576
num_steps = 256
minibatch = 24576
epochs = 2

[optimizer]
lr = 0.00025
gamma = 0.995
lam = 0.95
clip_eps = 0.2
vf_coef = 0.5
ent_coef = 0.01

[reward]
profile = "dense_win6_natural_flee"
step_penalty = 0.002
hit_reward = 1.5
win_bonus = 6.0
trade_win_bonus = 3.5
lose_bonus_start = 6.0
lose_bonus_floor = 5.0
mutual_hit_penalty = 1.0
double_death_penalty = 5.0
win_hp_bonus = 0.5
flee_bot_ratio = 0.20
timeout_mode = "hp_diff_scaled"
timeout_max_bonus = 2.0
timeout_per_hp = 0.5
timeout_alpha_mode = "shared_linear_anneal"
timeout_lead_bonus = 2.0
timeout_trail_penalty = 5.0
timeout_draw_bonus = -2.0
adv_top_frac = 0.25
crate_reward_coef = 0.5
crate_reward_floor = 0.10
crate_reward_anneal_steps = 9000000000
explore_reward_coef = 0.0
explore_reward_anneal_steps = 0
brick_reward_coef = 0.30
reward_anneal_k = 0.0
reward_anneal_step_offset = 0

[value]
head = "hl_gauss"
num_bins = 128
v_min = -20.0
v_max = 20.0
sigma = 1.5

[distributed]
world_size = 12
local_gpus = 2
lsgd_k = 32
lsgd_mode = "param"
lsgd_bf16 = false
lsgd_sync_state = false

[environment]
levels = "levels.json"
level_weights = "empty=0.05,功夫=0.25,比武=0.35"
curriculum_json = ""
radius = 0.36
n_total = 30
map = "13x15"
spawns = "symmetric"
crates = true
crate_rate = 0.25
flame_linger = 3
respawn = false
blast_decay = 0.0
pushable = true
push_t = 0.5
death_done = true
auto_reset = true
domain_rand = true
speed_tiers = "1.0,1.25,1.5,1.75,2.0,2.5,3.0,3.5,4.0,4.5,5.0"
max_bombs_range = "1,8"
max_blast_range = "1,10"
max_speed_range = "5,9"
initial_stats = "random"
initial_stats_weights = "min=0.10,mid=0.50,max=0.15,asym=0.25"
item_spawn_rates = "bomb=0.35,blast=0.35,speed=0.30"
item_pool_cap = 200
reseed_curriculum_steps = 0
episode_limit = 0
obs_channels = 14
encode_version = "v2"
state_version = "v3"
old_mode = false
crate_type_rates = "random=0.20,bomb=0.25,blast=0.25,speed=0.30"
super_crate_rate = 0.05
recycle_crates = true
airdrop = true
airdrop_interval = 300
airdrop_chance = 0.60
airdrop_types = "super=0.30,bomb=0.25,blast=0.25,speed=0.20"
airdrop_max_per_round = 3
symmetric_items = true
symmetric_spawns = true
fair_powerups = true
symmetric_stats = true
fair_crates = true
fair_map = true
tile_events = false
corridor = false
danger_penalty = 0.0
seed_offset = 0
shared_reset = true
shared_level_idx = true
train_p0 = true
train_p1 = true
no_mask = false
obs_quant = true

[checkpoint]
ckpt_dir = "ckpt"
ckpt_every = 60
ckpt_local_dir = "ckpt_local"
ckpt_local_every = 15
ckpt_max_to_keep = 3
ckpt_local_max_to_keep = 15

