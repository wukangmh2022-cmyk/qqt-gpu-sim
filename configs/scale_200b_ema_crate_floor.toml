# ============================================================================
# 实验：Scale 150B-200B / 20k-30k 长期稳健单调上涨标准配置
# 
# 核心设计理念（基于 Pommerman / Generals.io AverageJoe 论文与实测教训）：
# 1. 【避免 Late-Stage 震荡崩塌】：
#    - 绝对不使用永不退火的密集奖励（防止陷入吃箱子刷分 local minima）；
#    - 也不在 30B 彻底归零（防止 150B 后期因无前置奖励而遗忘破砖开箱发育）；
#    - 采用 crate_reward_floor = 0.05（10% 终身保底底噪）+ 60B 平滑退火！
# 2. 【白嫖 +30~50 ELO 稳定性】：
#    - 启用参数 EMA (Exponential Moving Average, decay=0.999)；
#    - 抹平自博弈对抗中的高频微扰，平滑策略更新，消除 10k 后的策略回撤。
# 3. 【严控云端与本地存储生命周期】：
#    - ckpt_max_to_keep = 3 (全量恢复档仅留最新 3 个，总盘占用锁定 < 15GB)；
#    - ckpt_local_max_to_keep = 10 (Rank0 轻量参数快照仅留最新 10 个)；
#    - 自动输出伴生 .meta.json 快照，实时记录 alpha、lose_bonus 等动态超参。
# ============================================================================

[run]
name = "scale_200b_ema_crate_floor_scheme1"
iters = 12000                         # 12k iters (在 16.78M steps/iter 下精准对应 201.3B 全局环境步)
seed = 42
fresh = true

[model]
arch = "transformer"
embed = 392
depth = 4
patch = 3
heads = 4
ff_factor = 4
obs_channels = 14                    # 14 通道 (含可推箱通道)
init_params = "ckpt/params_it00000068_hlgauss_top25foractor_patch3_k32.pkl" # [热启动底模] 继承 it68 (570M步) 战力起点
ema_decay = 0.999                    # [Generals.io 核心技术] 权重指数平均，提供 +30~50 Elo 平滑增益

[rollout]
num_envs = 32768                     # 24机48卡集群并行环境数 (单卡 682 envs)
num_steps = 256                      # 每次采样步长 (单轮 steps = 2 * 32768 * 256 = 16.78M)
minibatch = 32768
epochs = 2

[optimizer]
lr = 0.0003
gamma = 0.995                        # 适合 200B 尺度的长视距贴现
lam = 0.95
clip_eps = 0.2
vf_coef = 0.5
ent_coef = 0.01

[reward]
profile = "dense_win10_symmetric_pre_asym"
step_penalty = 0.001
hit_reward = 1.5
win_bonus = 10.0                     # 击杀胜者 +10
lose_bonus_start = 10.0              # 败者前期惩罚 -10
lose_bonus_floor = 3.0               # 败者后期惩罚退火到 -3 (防被击杀过分保守)
timeout_mode = "hp_diff_scaled"
timeout_max_bonus = 2.0
timeout_per_hp = 0.5
timeout_alpha_mode = "shared_linear_anneal"
timeout_lead_bonus = 0.0
timeout_trail_penalty = 0.0
timeout_draw_bonus = 0.0
adv_top_frac = 0.25                  # Actor Top25% 优势过滤 (加速样本效率)

# ---- 道具开箱渐进保底退火 (Floor Annealing) ----
crate_reward_coef = 0.5              # 前期高诱导系数 (加速 0~30B 冷启动破障)
crate_reward_floor = 0.05            # [核心底噪] 10% 终生保底底噪，确保 150B-200B 永不遗忘发育
crate_reward_anneal_steps = 60000000000 # 60B 全局步平滑退火到底噪 (占 200B 总步数的前 30%)

explore_reward_coef = 0.0
explore_reward_anneal_steps = 0
brick_reward_coef = 0.0
reward_anneal_k = 0.0                # 保持稳定确定性退火
reward_anneal_step_offset = 0

[value]
head = "hl_gauss"
num_bins = 128
v_min = -20.0
v_max = 20.0
sigma = 1.5

[distributed]
world_size = 24                      # 24 机器
local_gpus = 2                       # 每机 2 卡 (总计 48 卡)
lsgd_k = 256                         # Local-SGD 周期 (对齐 launch_24nodes.sh)
lsgd_mode = "param"
lsgd_bf16 = false
lsgd_sync_state = false

[environment]
levels = "levels.json"               # 标准 241 张 QQ堂官方地图池
level_weights = "empty=0.05,功夫=0.1,比武=0.15"
curriculum_json = ""
radius = 0.36
n_total = 48                         # 总 GPU 卡数
map = "13x15"

[runtime]
no_mask = false
obs_quant = false
legacy_obs13 = false                 # 标准 14 通道
checkpoint = true
tolerate_inconsistent = false

[evaluation]
eval_vs = ""
eval_every = 0

[checkpoint]
ckpt_dir = "runs/scale_200b_ema_crate_floor_scheme1/ckpt"
ckpt_every = 30                      # 每 30 分钟落盘全量恢复档 (每卡一份)
ckpt_max_to_keep = 3                 # 滚动仅保留最新 3 个全量恢复档 (严控云端磁盘总占用 < 15GB)
ckpt_local_dir = "runs/scale_200b_ema_crate_floor_scheme1/ckpt_local"
ckpt_local_every = 15                # 每 15 分钟落盘 Rank0 轻量参数快照 (供 Watchdog 评测与 AI 巡检)
ckpt_local_max_to_keep = 10          # 滚动仅保留最新 10 个评估快照
