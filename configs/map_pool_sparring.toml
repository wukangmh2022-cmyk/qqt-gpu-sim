# ============================================================================
# QQ堂 AI 竞技微操与终局决战 地图采样配置 (Map Pool Sparring)
#
# 设计说明：
# 1. 摒弃旧版 Stage 1-4 递进观念，统一基于 241 张权威地图池按实战价值进行加权抽样；
# 2. 空场景 (empty=0.05)：永久开启 4 档域随机化初始属性（P0/P1 严格对称），泛化终局微操对决；
# 3. 经典高频竞技与空旷对练图提升权重（比武系列、珍宝岛、夺宝10、功夫01/05、新年瑞兽、景阳岗、水面11、雪地等）；
# 4. 其余 170+ 张官方地图均分剩余 60% 权重，保持全图池全局泛化能力。
# ============================================================================

[weights]
# [终局微操与域随机化]
"empty" = 0.05       # 空场景（关卡 240）：启用 4 档域随机化属性对决

# [核心格斗与比武系列]（共 35 张：比武01~09、比赛01、推箱子等）
"比武" = 0.15        # 比武全系列，类内 35 张关卡均分 15%

# [玩家经典常用开阔/道具/对练地图]
"珍宝岛" = 0.03      # 珍宝岛、珍宝岛(新) 均分 3%
"夺宝10" = 0.02      # 夺宝10
"功夫01" = 0.02      # 功夫01（经典平头空旷开荒）
"功夫05" = 0.02      # 功夫05(道具场)
"新年瑞兽" = 0.02    # 新年瑞兽(道具场)
"景阳岗" = 0.02      # 景阳岗
"水面11" = 0.02      # 水面11（开阔水道）
"雪地" = 0.05        # 雪地系列（共 24 张，含雪地08道具场等）

# 未在此处指定的关卡将自动均分剩余 60% 的采样概率
