# ============================================================================
# 实验：9节点18卡 DCU 进阶进攻超长训 - 优雅刺客与血量保全版 (Warm-Start 继承 it594)
# 核心规格：
# 1. 规模：9 机 × 2 卡 = 18 张 DCU，num_envs=18432 (单卡 1024 envs)
# 2. 轮次：1100 iters (自 it594 起跑)
# 3. 底模继承 (Warm-Start)：基于最新 53 亿步的 params_it00000594.pkl
# 4. 抑制定向自爆换血、消除同归浪死、激励高血量完胜：
#    - mutual_hit_penalty = 1.0 (同 tick 双方互损换血惩罚：互损扣 1 分)
#    - double_death_penalty = 8.0 (双方同时暴毙双亡重罚：消除优势浪死无惩罚漏洞)
#    - win_hp_bonus = 0.5 (获胜残余血量激励：每剩 1 滴血 +0.5 分，满血完胜 +1.5 分)
# 5. 继承原有激进破拆与惩罚：
#    - brick_reward_coef = 0.30 (破墙即时奖励)
#    - step_penalty = 0.002 (时间流逝惩罚，坚决打击消极)
#    - timeout_draw_bonus = -2.0 (超时平局双输重罚)
#    - timeout_trail_penalty = 6.0 (落后逃跑重罚，逼迫绝地反击)
#    - timeout_lead_bonus = 2.0 (超时血多小奖)
# ============================================================================

[run]
name = "long_8h_aggressive_clean"
iters = 1100
seed = 42
fresh = true

[model]
arch = "transformer"
embed = 392
depth = 4
patch = 3
heads = 4
ff_factor = 4
obs_channels = 14
init_params = "ckpt/params_it00000349_ema.pkl"
ema_decay = 0.995

[rollout]
num_envs = 24576
num_steps = 256
minibatch = 24576
epochs = 2

[optimizer]
lr = 0.00025
gamma = 0.995
lam = 0.95
clip_eps = 0.2
vf_coef = 0.5
ent_coef = 0.01

[reward]
profile = "dense_win6_natural_flee"
step_penalty = 0.002
hit_reward = 1.5
win_bonus = 6.0
trade_win_bonus = 3.5
lose_bonus_start = 6.0
lose_bonus_floor = 5.0
mutual_hit_penalty = 1.0
double_death_penalty = 5.0
win_hp_bonus = 0.5
flee_bot_ratio = 0.20
timeout_mode = "hp_diff_scaled"
timeout_max_bonus = 2.0
timeout_per_hp = 0.5
timeout_alpha_mode = "shared_linear_anneal"
timeout_lead_bonus = 2.0
timeout_trail_penalty = 5.0
timeout_draw_bonus = -2.0
adv_top_frac = 0.25
crate_reward_coef = 0.5
crate_reward_floor = 0.10
crate_reward_anneal_steps = 9000000000
explore_reward_coef = 0.0
explore_reward_anneal_steps = 0
brick_reward_coef = 0.30
reward_anneal_k = 0.0
reward_anneal_step_offset = 0

[value]
head = "hl_gauss"
num_bins = 128
v_min = -20.0
v_max = 20.0
sigma = 1.5

[distributed]
world_size = 12
local_gpus = 2
lsgd_k = 32
lsgd_mode = "param"
lsgd_bf16 = false
lsgd_sync_state = false

[environment]
levels = "levels.json"
level_weights = "empty=0.05,功夫=0.25,比武=0.35"
curriculum_json = ""
radius = 0.36
n_total = 30
map = "13x15"

[runtime]
no_mask = false
obs_quant = false
legacy_obs13 = false
checkpoint = true
tolerate_inconsistent = false

[evaluation]
eval_vs = ""
eval_every = 0

[checkpoint]
ckpt_dir = "runs/long_8h_aggressive_clean/ckpt"
ckpt_every = 100
ckpt_local_dir = "runs/long_8h_aggressive_clean/ckpt_local"
ckpt_local_every = 15
ckpt_max_to_keep = 3
ckpt_local_max_to_keep = 15
