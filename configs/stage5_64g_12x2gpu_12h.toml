# ============================================================================
# 第五阶段：12 节点 24 卡 (12x2) 64GB DCU 12 小时 5Hz 宗师全图长训
# 适配 64GB 高显存卡版本（obs_quant=false 完整 float32 精度）
# Warm-Start 继承 params_it00000831_ema.pkl
# 规模：12 节点 x 2 卡 = 24 张 64GB DCU，约 10-12 小时完训
# ============================================================================

[run]
name = "stage5_64g_12x2gpu_12h"
iters = 1100
seed = 2026
fresh = false

[runtime]
action_repeat = 2
no_mask = false
obs_quant = false
checkpoint = false

[model]
arch = "transformer"
embed = 392
depth = 4
patch = 3
heads = 4
ff_factor = 4
obs_channels = 14
init_params = "ckpt/params_it00000831_ema.pkl"
ema_decay = 0.995

[rollout]
num_envs = 24576
num_steps = 256
minibatch = 24576
epochs = 2

[optimizer]
lr = 0.00015
gamma = 0.995
lam = 0.95
clip_eps = 0.2
vf_coef = 0.5
ent_coef = 0.008

[reward]
profile = "dense_win10_stage5_clean"
step_penalty = 0.002
idle_penalty = 0.015
hit_reward = 1.5
win_bonus = 10.0
trade_win_bonus = 5.0
lose_bonus_start = 5.0
lose_bonus_floor = 5.0
mutual_hit_penalty = 0.0
double_death_penalty = 5.0
win_hp_bonus = 0.2
flee_bot_ratio = 0.40
timeout_mode = "hp_diff_scaled"
timeout_max_bonus = 2.0
timeout_per_hp = 0.5
timeout_alpha_mode = "shared_linear_anneal"
timeout_lead_bonus = 2.0
timeout_trail_penalty = 5.0
timeout_draw_bonus = -3.0
adv_top_frac = 0.25
crate_reward_coef = 0.25
crate_reward_floor = 0.10
crate_reward_anneal_steps = 0
explore_reward_coef = 0.0
explore_reward_anneal_steps = 0
brick_reward_coef = 0.20
reward_anneal_k = 0.0
reward_anneal_step_offset = 0

[value]
head = "hl_gauss"
num_bins = 128
v_min = -20.0
v_max = 20.0
sigma = 1.5

[distributed]
world_size = 12
local_gpus = 2
lsgd_k = 32
lsgd_mode = "param"
lsgd_bf16 = false
lsgd_sync_state = false

[environment]
levels = "levels.json"
level_weights = ""
curriculum_json = ""
radius = 0.36
n_total = 30
map = "13x15"
spawns = "symmetric"
crates = true
crate_rate = 0.25
flame_linger = 3
respawn = false
blast_decay = 0.0
pushable = true
push_t = 0.5
death_done = true
auto_reset = true
domain_rand = true
speed_tiers = "1.0,1.25,1.5,1.75,2.0,2.5,3.0,3.5,4.0,4.5,5.0"
max_bombs_range = "1,8"
max_blast_range = "1,10"
max_speed_range = "5,9"
initial_stats = "random"
initial_stats_weights = "min=0.10,mid=0.50,max=0.15,asym=0.25"
item_spawn_rates = "bomb=0.35,blast=0.35,speed=0.30"
item_pool_cap = 200
reseed_curriculum_steps = 0
episode_limit = 0
obs_channels = 14
encode_version = "v2"
state_version = "v3"
old_mode = false
crate_type_rates = "random=0.20,bomb=0.25,blast=0.25,speed=0.30"
super_crate_rate = 0.05
recycle_crates = true
airdrop = true
